name: Label newly opened RFC PRs

on:
  pull_request_target: # This workflow has permissions on the repo, do NOT run code from PRs in this workflow. See https://securitylab.github.com/research/github-actions-preventing-pwn-requests/
    types: [opened]
    paths:
      - 'text/*.md'

permissions: {}

jobs:
  label-pr:
    runs-on: ubuntu-latest
    permissions:
      issues: write # in case the S-Proposed label has to be created
      pull-requests: write # labeling a PR through the issues API requires this
    steps:
      - name: Label PR when it adds an RFC
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          added_rfc_count="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[] | select(.status == "added" and (.filename | startswith("text/") and endswith(".md"))) | .filename' \
            | wc -l)"

          if (( added_rfc_count > 0 )); then
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" \
              -f 'labels[]=S-Proposed' > /dev/null
          fi
