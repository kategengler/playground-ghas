name: Reusable workflow to open advancement PRs

on:
  workflow_call:
    inputs:
      new-stage:
        required: true
        type: string
      rfc-path:
        required: true
        type: string
      rfc-number:
        required: true
        type: string
    secrets:
      personal-access-token:
        required: true

permissions: {}

jobs:
  advance-rfc:
    name: Open PR to advance RFC to the next stage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate RFC inputs
        env:
          RFC_PATH: ${{ inputs.rfc-path }}
          RFC_NUMBER: ${{ inputs.rfc-number }}
          NEW_STAGE: ${{ inputs.new-stage }}
        run: |
          if [[ ! "$RFC_NUMBER" =~ ^[0-9]+$ ]] || [[ ! "$RFC_PATH" =~ ^text/([0-9]+)-[^/]+\.md$ ]] || [[ "$RFC_PATH" == *$'\n'* || "$RFC_PATH" == *$'\r'* ]] || [[ ! -f "$RFC_PATH" ]]; then
            echo "::error::Invalid RFC path or number"
            exit 1
          fi

          if [[ "${BASH_REMATCH[1]}" != "$RFC_NUMBER" ]]; then
            echo "::error::RFC path and number do not match"
            exit 1
          fi

          case "$NEW_STAGE" in
            ready-for-release|released|recommended) ;;
            *)
              echo "::error::Invalid RFC advancement stage"
              exit 1
              ;;
          esac

      - name: Setup RFCs tooling
        uses: ./.github/actions/setup-rfcs-tooling

      - name: Update frontmatter
        env:
          RFC_PATH: ${{ inputs.rfc-path }}
          NEW_STAGE: ${{ inputs.new-stage }}
        run: |
          node rfcs-tooling/scripts/update-rfc-stage.mjs "$NEW_STAGE" "$RFC_PATH"

      - name: Set variables for use in PR
        id: pr-variables
        env:
          RFC_PATH: ${{ inputs.rfc-path }}
          RFC_NUMBER: ${{ inputs.rfc-number }}
          NEW_STAGE: ${{ inputs.new-stage }}
        run: |
          frontmatter=`node rfcs-tooling/scripts/rfc-frontmatter.mjs $RFC_PATH`
          ready_for_release_pr=`echo $frontmatter | jq '.prs."ready-for-release"'`
          ready_for_release_pr=${ready_for_release_pr//\"/}
          released_pr=`echo $frontmatter | jq '.prs.released'`
          released_pr=${released_pr//\"/}
          rendered_rfc_url="https://github.com/$GITHUB_REPOSITORY/blob/advance-rfc-$RFC_NUMBER/$RFC_PATH"
          title=`echo $frontmatter | jq '.title'`
          if [[ $NEW_STAGE == "ready-for-release" ]]; then
            pretty_stage="Ready for Release"
            template=`sed -e 's/__RFC_NUMBER__/$RFC_NUMBER/g' -e "s>__RFC_RENDERED_URL__>$rendered_rfc_url>g" .github/PULL_REQUEST_TEMPLATE/advance-to-ready-for-release.md`  
          elif [[ $NEW_STAGE == "released" ]]; then
            pretty_stage="Released"
            template=`sed -e 's/__RFC_NUMBER__/$RFC_NUMBER/g' -e "s>__READY_FOR_RELEASE_PR__>$ready_for_release_pr>g" -e "s>__RFC_RENDERED_URL__>$rendered_rfc_url>g" .github/PULL_REQUEST_TEMPLATE/advance-to-released.md`
          elif [[ $NEW_STAGE == "recommended" ]]; then
            pretty_stage="Recommended"
            template=`sed -e 's/__RFC_NUMBER__/$RFC_NUMBER/g' -e "s>__READY_FOR_RELEASE_PR__>$ready_for_release_pr>g" -e "s>__RELEASED_PR__>$released_pr>g" -e "s>__RFC_RENDERED_URL__>$rendered_rfc_url>g" .github/PULL_REQUEST_TEMPLATE/advance-to-recommended.md`
          fi
          echo 'body<<EOF' >> $GITHUB_OUTPUT
          echo "$template" >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT     
          echo "Pretty Stage: $pretty_stage"
          echo "pretty-stage=$pretty_stage" >> $GITHUB_OUTPUT
          echo "title=$title" >> $GITHUB_OUTPUT

      - name: Open PR
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.personal-access-token }}
          commit-message: "Advance RFC ${{ inputs.rfc-number }} to Stage ${{ inputs.new-stage }}"
          add-paths: 'text'
          branch: "advance-rfc-${{ inputs.rfc-number }}"
          title: "Advance RFC #${{ inputs.rfc-number}} `${{ steps.pr-variables.outputs.title }}` to Stage ${{ steps.pr-variables.outputs.pretty-stage }}"
          body: "${{ steps.pr-variables.outputs.body }}"
          labels: "RFC Advancement,S-${{ steps.pr-variables.outputs.pretty-stage}}"
          draft: true

      - name: Add new PR link to RFC frontmatter
        env:
          RFC_PATH: ${{ inputs.rfc-path }}
          NEW_STAGE: ${{ inputs.new-stage }}
          PULL_REQUEST_URL: ${{ steps.create-pr.outputs.pull-request-url }}
        run: |
          node rfcs-tooling/scripts/update-advancement-pr.mjs "$RFC_PATH" "$NEW_STAGE" "$PULL_REQUEST_URL"

      - name: Update PR
        env:
          GH_TOKEN: ${{ secrets.personal-access-token }}
          RFC_PATH: ${{ inputs.rfc-path }}
          RFC_NUMBER: ${{ inputs.rfc-number }}
          NEW_STAGE: ${{ inputs.new-stage }}
          PULL_REQUEST_URL: ${{ steps.create-pr.outputs.pull-request-url }}
        run: |
          git config --local user.email 'ember-rfcs@example.com'
          git config --local user.name 'Ember.js RFCS CI'
          git add -- "$RFC_PATH"
          git commit -m "Update RFC $RFC_NUMBER $NEW_STAGE PR URL"
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c "http.extraheader=AUTHORIZATION: basic $auth_header" push origin "advance-rfc-$RFC_NUMBER"
          printf '## Opened PR %s\n' "$PULL_REQUEST_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Add PR to artifact
        env:
          RFC_PATH: ${{ inputs.rfc-path }}
          RFC_NUMBER: ${{ inputs.rfc-number }}
          NEW_STAGE: ${{ inputs.new-stage }}
          PULL_REQUEST_URL: ${{ steps.create-pr.outputs.pull-request-url }}
        run: |
          echo '{ "file": "$RFC_PATH", "number": "$RFC_NUMBER", "pr": "$PULL_REQUEST_URL", "advancementStage": "$NEW_STAGE" }' > advance-rfc-$RFC_NUMBER.json

      - name: Upload artifact of open RFC PRs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: advancement-prs
          path: advance-rfc-${{ inputs.rfc-number }}.json
          overwrite: true
          if-no-files-found: error
